<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>demo-lab | LadyBugLoop</title>
<style>
:root{color-scheme:only light;--paper:#f2f2f4;--card:#fff;--hair:#e1e1e6;--ink:#1c1622;--ink-2:#5b5466;--accent:#c92a86}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#16131c;--card:#221d2b;--hair:#342d40;--ink:#f3eef7;--ink-2:#b9b0c6;--accent:#f0569b}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Heebo,sans-serif;font-size:18px;line-height:1.6;background:var(--paper);color:var(--ink);padding:28px 16px}
main{max-width:560px;margin:0 auto}
h1{font-weight:900;font-size:26px;margin-bottom:6px}
p.s{color:var(--ink-2);margin-bottom:18px}
ul{list-style:none;display:grid;gap:10px}
a{display:block;background:var(--card);border:1.5px solid var(--hair);border-radius:14px;padding:14px 16px;color:inherit;text-decoration:none;min-height:48px}
a b{color:var(--accent);font-weight:900;margin-inline-end:6px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>שלוש אפשרויות להדגמה</h1>
  <p class="s">פותחים בטלפון, לוחצים על החיפושית.</p>
  <ul>
    <li><a href="a/"><b>א</b>חלון מוצר קטן, כמו באפליקציה: הדיווח עף לכרטיס, הכרטיס הופך ל־PR.</a></li>
    <li><a href="b/"><b>ב</b>מעגל: אסימון קטן עושה סיבוב, דיווח, כרטיס, תיקון, אישור.</a></li>
    <li><a href="c/"><b>ג</b>קולנועי: מילה ענקית לכל שלב, והמסך נחתך כדי שתראו את הדף משתנה.</a></li>
  </ul>
</main>
</body>
</html>
