<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>חתימת דוא״ל</title>
<style>
:root{color-scheme:light}
body{margin:0;background:#faf8fc;color:#1a1533;font-family:Heebo,Arial,sans-serif;font-size:17px;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:32px 20px}
h1{font-size:26px;margin:0 0 6px}
p{margin:0 0 20px;color:#5b5670}
.card{background:#fff;border:1px solid #e6e1ee;border-radius:14px;padding:28px 24px;overflow-x:auto;direction:ltr}
.btn{margin-top:20px;min-height:46px;padding:0 24px;border:0;border-radius:10px;background:#c2185b;color:#fff;font:700 16px Heebo,Arial,sans-serif;cursor:pointer}
.btn:focus-visible{outline:3px solid #1a1533;outline-offset:2px}
ol{padding-inline-start:22px;margin:24px 0 0}
li{margin-bottom:6px}
#st{margin-inline-start:12px;color:#17663a;font-weight:600}

</head>
<body>
<main>

<div class="card" id="sig">
<div dir="ltr" style="direction:ltr;text-align:left;"><table dir="ltr" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;text-align:left;font-family:Arial,Helvetica,sans-serif;direction:ltr;">
<tr>
<td dir="ltr" align="left" valign="middle" style="direction:ltr;text-align:left;padding:0 16px 0 0;">

</td>
<td dir="ltr" align="left" valign="middle" style="direction:ltr;text-align:left;padding:2px 0 2px 16px;border-left:3px solid #f0529c;">
<div dir="ltr" style="direction:ltr;text-align:left;font-size:18px;line-height:22px;font-weight:bold;color:#1a1533;">Ifat Biran</div>
<div dir="ltr" style="direction:ltr;text-align:left;font-size:13px;line-height:20px;color:#5b5670;">Founder, <b style="color:#1a1533;">LadyBugLoop</b></div>
<div dir="ltr" style="direction:ltr;text-align:left;font-size:13px;line-height:22px;padding-top:6px;"><a href="https://ladybugloop.com" style="white-space:nowrap;color:#c2185b;text-decoration:none;font-weight:bold;">ladybugloop.com</a> <span style="color:#c9c5d6;">&nbsp;&middot;&nbsp;</span><a href="mailto:ifatbiran@gmail.com" style="white-space:nowrap;color:#5b5670;text-decoration:none;">ifatbiran@gmail.com</a></div>
<div dir="ltr" style="direction:ltr;text-align:left;font-size:12px;line-height:18px;"><a href="https://ifatbiran.github.io/ladybugloop-intro/film.mp4" style="white-space:nowrap;color:#8a85a0;text-decoration:none;">Watch the film</a> <span style="color:#c9c5d6;">&nbsp;&middot;&nbsp;</span><a href="https://ifatbiran.github.io/ladybugloop-intro/me/" style="white-space:nowrap;color:#8a85a0;text-decoration:none;">About me</a></div>
</td>
</tr>
</table></div>
</div>
<button class="btn" id="copy" type="button">העתקת החתימה</button><span id="st" role="status"></span>
<ol>
<li>לחיצה על "העתקת החתימה".</li>
<li>Gmail: הגדרות, הצגת כל ההגדרות, חתימה, יצירת חתימה חדשה.</li>
<li>הדבקה בתיבת החתימה ושמירת שינויים.</li>
</ol>
</main>
<script>
document.getElementById('copy').addEventListener('click',function(){
  var el=document.getElementById('sig'),st=document.getElementById('st');
  try{var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);
  st.textContent=document.execCommand('copy')?'הועתק.':'ההעתקה נכשלה. יש לסמן ידנית.';}catch(e){st.textContent='ההעתקה נכשלה. יש לסמן ידנית.';}
});
</script>

</html>
